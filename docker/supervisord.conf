[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)sx24
autorestart=true
priority=100

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=200

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -passwd %(ENV_VNC_PASSWORD)s
autorestart=true
priority=300

[program:novnc]
command=/opt/novnc/utils/websockify/run --web /opt/novnc 6080 localhost:5900
autorestart=true
priority=400

[program:electron]
command=/bin/bash -c 'echo "" && echo "========================================" && echo "  Startup Success!" && echo "  noVNC (Web): http://localhost:6080/vnc.html" && echo "  VNC Port: 5900  |  Password: %(ENV_VNC_PASSWORD)s" && echo "========================================" && echo "" && /app/release/linux-arm64-unpacked/html-release-updater --no-sandbox'
directory=/app
environment=DISPLAY=":99",ELECTRON_DISABLE_GPU="true",ELECTRON_ENABLE_LOGGING="1"
autorestart=true
priority=500
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
